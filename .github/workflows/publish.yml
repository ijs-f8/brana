name: Publish Python package to PyPI

# Define when the workflow is triggered
on:

  # Run when a GitHub release is published
  release:
    types: [published]

  # Allow manual execution for testing the build
  workflow_dispatch:

# Disable permissions unless explicitly granted
permissions: {}

jobs:

  # ========================================
  # JOB 1: Build the Python package
  # ========================================
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Download the repository
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Install Python packaging tools
      - name: Install build tools
        run: python -m pip install --upgrade build twine

      # Build wheel and source distribution
      - name: Build package
        run: python -m build

      # Validate the generated distribution files
      - name: Check distributions
        run: python -m twine check --strict dist/*

      # Temporarily store the distribution files
      - name: Upload distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  # ========================================
  # JOB 2: Publish the package to PyPI
  # ========================================
  publish:

    # Only publish when a GitHub release is published
    if: github.event_name == 'release'

    # Wait for the build job to succeed
    needs: build

    runs-on: ubuntu-latest

    # GitHub environment for Trusted Publishing
    environment:
      name: pypi

    # Allow authentication with PyPI
    permissions:
      id-token: write

    steps:

      # Retrieve the distribution files
      - name: Download distribution files
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      # Publish to PyPI using Trusted Publishing
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1