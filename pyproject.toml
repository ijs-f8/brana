[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brana"
version = "0.1.1"
description = "Brana is toolkit for working with MCNP calculations. I enables input parsing and editing, output parsing as numpy NDarrays and manupulation of meshtally files."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy",
	"h5py",
]

[tool.setuptools.packages.find]
where = ["src"]